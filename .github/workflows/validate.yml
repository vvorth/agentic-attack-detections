name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install -r tools/requirements.txt
          echo "deb https://download.opensuse.org/repositories/security:/zeek/xUbuntu_24.04/ /" | sudo tee /etc/apt/sources.list.d/zeek.list
          curl -fsSL https://download.opensuse.org/repositories/security:/zeek/xUbuntu_24.04/Release.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/zeek.gpg > /dev/null
          sudo apt-get update
          sudo apt-get install -y suricata zeek-9.0-core
          echo /opt/zeek/bin >> "$GITHUB_PATH"
      - name: Test IOC confidence, expiry and SID policy
        run: python3 -m unittest discover -s tests/feeds -p 'test_*.py' -v
      - name: Test the Elastic regex and case rewrites
        run: python3 -m unittest discover -s tests/elastic -p 'test_*.py' -v
      - name: Validate rules, queries and feeds
        run: python tools/validate.py
      - name: Check Sigma rules against test events
        run: python tests/sigma/run_tests.py
      - name: Start the Kusto emulator
        run: docker run -d --name kusto -e ACCEPT_EULA=Y -p 8080:8080 mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
      - name: Run hunts and analytics against sample rows
        run: python tests/kql/run_tests.py --require --wait 180
      - name: Replay test flows through Suricata
        run: python tests/suricata/run_tests.py
      - name: Run the Zeek tests
        run: |
          zeek --version
          bash behaviors/zeek/tests/run_tests.sh
          bash frameworks/artex/tests/run_network_tests.sh
          bash frameworks/cyberstrikeai/tests/run_zeek_tests.sh
          bash frameworks/hexstrike/tests/run_zeek_tests.sh
          bash frameworks/autocve/tests/run_zeek_tests.sh
          bash frameworks/luan1aoagent/tests/run_zeek_tests.sh
      - name: Convert Sigma to Splunk, Sentinel and Elastic
        run: python tools/convert.py
      - name: Check generated conversions are committed
        run: git diff --exit-code generated/ || (echo "Run tools/convert.py and commit generated/" && exit 1)
      - name: Build the Elastic import and check it is committed
        run: python tools/build_elastic.py --check
      - name: Build the ATT&CK coverage and layers, and check they are committed
        run: python tools/build_attack.py --check
      - name: Build the Microsoft Sentinel templates, validate them and check they are committed
        run: python tools/build_sentinel.py --check
      - name: Build the Splunk app, check it is committed and run Splunk AppInspect
        run: |
          python tools/build_splunk.py --check --package dist-splunk
          pip install splunk-appinspect
          splunk-appinspect inspect dist-splunk/agentic-attack-detections-splunk.tgz --data-format json --output-file appinspect.json > /dev/null
          python tools/build_splunk.py --appinspect-result appinspect.json
      - name: Build WAF rules and check they are committed
        run: |
          python tools/build_waf.py
          git diff --exit-code waf/ || (echo "Run tools/build_waf.py and commit waf/" && exit 1)
      - name: Test WAF rules on Cloudflare, AWS WAF and Azure WAF
        run: python tests/waf/run_tests.py
      - name: Lint the CloudFormation template
        run: cfn-lint waf/aws/cloudformation.yaml
      - name: Build the release files and load the combined Suricata rules
        run: |
          python tools/build_release.py --out dist
          (cd dist && sha256sum -c SHA256SUMS.txt)
          suricata -T -S dist/agentic-attack-detections.rules -l /tmp --init-errors-fatal --set unix-command.enabled=no

  sentinelone-cortex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Convert Sigma to SentinelOne S1QL and PowerQuery
        run: |
          python -m venv /tmp/venv-s1
          /tmp/venv-s1/bin/pip install -r tools/requirements-sentinelone.txt
          /tmp/venv-s1/bin/python tools/convert_sentinelone.py
      - name: Convert Sigma to Cortex XDR XQL
        run: |
          python -m venv /tmp/venv-cortex
          /tmp/venv-cortex/bin/pip install -r tools/requirements-cortex.txt
          /tmp/venv-cortex/bin/python tools/convert_cortex.py
      - name: Check the conversions are committed
        run: |
          git add -N generated/sentinelone generated/cortex_xdr
          git diff --exit-code generated/sentinelone generated/cortex_xdr || (echo "Run tools/convert_sentinelone.py and tools/convert_cortex.py and commit generated/" && exit 1)

  splunk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -r tools/requirements.txt
      - name: Package the app and the test data app
        run: |
          python tools/build_splunk.py --check --package /tmp/apps
          tar -C tests/splunk -czf /tmp/apps/aad-test.tgz TA-aad-test
          chmod -R a+rX /tmp/apps
      - name: Start Splunk with both apps installed
        run: |
          echo "SPLUNK_PASSWORD=$(openssl rand -hex 12)Aa1!" >> "$GITHUB_ENV"
          echo "SPLUNK_HEC_TOKEN=$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_ENV"
      - run: |
          docker run -d --name splunk -p 8089:8089 -p 8088:8088 -v /tmp/apps:/tmp/apps:ro \
            -e SPLUNK_START_ARGS=--accept-license -e SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com \
            -e SPLUNK_PASSWORD -e SPLUNK_HEC_TOKEN \
            -e SPLUNK_APPS_URL=/tmp/apps/agentic-attack-detections-splunk.tgz,/tmp/apps/aad-test.tgz \
            splunk/splunk:10.6.2
          for i in $(seq 1 90); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' splunk)" = healthy ] && break
            sleep 10
          done
          docker inspect -f '{{.State.Health.Status}}' splunk | grep -qx healthy || { docker logs splunk | tail -50; exit 1; }
      - name: Run the searches against test events
        run: python tests/splunk/run_tests.py --url https://localhost:8089 --hec https://localhost:8088

  elastic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -r tools/requirements.txt
      - name: Start Elasticsearch and Kibana
        run: lab/lab.sh up elastic
      - name: Run the rules against test events and import them into Kibana
        run: |
          set -a; . lab/.env; set +a
          python tests/elastic/run_tests.py
      - name: Kibana log on failure
        if: failure()
        run: docker logs aad-kibana 2>&1 | tail -80

  waf-iac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - name: Validate Terraform
        run: |
          for dir in waf/cloudflare/terraform waf/aws/terraform; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done
      - name: Compile Bicep
        run: |
          az bicep install
          for f in waf/azure/*.bicep; do
            az bicep build --file "$f" --stdout > /dev/null 2> bicep.log || { cat bicep.log; exit 1; }
            cat bicep.log
            if grep -qi warning bicep.log; then echo "Bicep warnings in $f"; exit 1; fi
          done
